name: NewsDigest
options:
  bundleIdPrefix: com.newsdigest
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
targets:
  NewsDigest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NewsDigest
    dependencies:
      - package: Supabase
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: NewsDigest
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # From Supabase.xcconfig (not in git)
        SupabaseHost: $(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        UIBackgroundModes:
          - audio   # keep reading aloud with the screen locked
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    configFiles:
      Debug: Supabase.xcconfig
      Release: Supabase.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newsdigest.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
