name: Daily digest

on:
  schedule:
    # Every hour from 06:00 to 23:00 Dhaka time (UTC+6). Once a paper is done, later runs skip it;
    # once both are done, runs stop before installing the browser.
    - cron: "0 0-17 * * *"
  workflow_dispatch:
    inputs:
      paper:
        description: "Only this paper (dailystar / prothomalo). Empty = both."
        required: false
      force:
        description: "Re-run even if today's digest exists"
        type: boolean
        default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Check if today is already done
        id: check
        if: ${{ inputs.force != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check-done -- ${{ inputs.paper && format('--paper {0}', inputs.paper) || '' }}

      - if: steps.check.outputs.done != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build digest
        if: steps.check.outputs.done != 'true'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_FALLBACK: ${{ vars.GROQ_FALLBACK }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          DIGEST_LANG: ${{ vars.DIGEST_LANG }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAILYSTAR_EMAIL: ${{ secrets.DAILYSTAR_EMAIL }}
          DAILYSTAR_PASSWORD: ${{ secrets.DAILYSTAR_PASSWORD }}
          PROTHOMALO_EMAIL: ${{ secrets.PROTHOMALO_EMAIL }}
          PROTHOMALO_PASSWORD: ${{ secrets.PROTHOMALO_PASSWORD }}
          PROTHOMALO_SESSION: ${{ secrets.PROTHOMALO_SESSION }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.paper }}" ]; then ARGS="$ARGS --paper ${{ inputs.paper }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          npm run digest -- $ARGS
